<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БАЛАНС 3D — симулятор энергосистемы</title>
<style>
:root{
  --bg:#1a2332; --panel:#243447; --panel-light:#2d4260;
  --text:#e8dcc4; --text-dim:#9aa5b1;
  --amber:#e8a33d; --copper:#b87333;
  --green:#6ba368; --red:#d45454; --gold:#ffd966; --cold:#5c8b9e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--text);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.4;user-select:none;-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:0;z-index:1}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}

#loader{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#2d4260 0%,#1a2332 80%);color:var(--amber);font-family:Georgia,serif;font-size:32px;letter-spacing:8px;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.start-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(45,66,96,.85) 0%,rgba(26,35,50,.98) 75%);z-index:1500;backdrop-filter:blur(4px)}
.start-content{text-align:center;max-width:620px;padding:40px;animation:fadeIn 1.4s ease}
.start-title{font-family:Georgia,serif;font-size:96px;letter-spacing:14px;color:var(--amber);margin-bottom:12px;text-shadow:0 6px 50px rgba(232,163,61,.7)}
.start-subtitle{font-family:Georgia,serif;font-size:18px;color:var(--text-dim);margin-bottom:32px;font-style:italic}
.start-desc{font-size:16px;color:var(--text);margin:0 auto 36px;line-height:1.7;max-width:460px;opacity:.9}
.start-buttons{display:flex;flex-direction:column;gap:14px;align-items:center}
.btn-start{background:linear-gradient(180deg,var(--amber),var(--copper));color:#1a2332;border:none;padding:18px 72px;font-size:18px;font-weight:700;letter-spacing:3px;border-radius:8px;box-shadow:0 6px 28px rgba(232,163,61,.5);transition:transform .15s,box-shadow .15s}
.btn-start:hover{transform:translateY(-2px);box-shadow:0 10px 40px rgba(232,163,61,.7)}
.btn-start:active{transform:scale(.97)}
.btn-reset{background:transparent;border:1px solid var(--text-dim);color:var(--text-dim);padding:8px 24px;font-size:13px;border-radius:6px;transition:all .15s}
.btn-reset:hover{color:var(--red);border-color:var(--red)}

.game-ui{position:fixed;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column}

.top-panel{pointer-events:auto;height:68px;background:linear-gradient(180deg,rgba(36,52,71,.95),rgba(36,52,71,.85));backdrop-filter:blur(8px);border-bottom:2px solid var(--copper);display:flex;align-items:center;padding:0 16px;gap:16px;flex-shrink:0;box-shadow:0 2px 20px rgba(0,0,0,.5)}
.top-left{display:flex;gap:6px}
.top-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:120px}
.icon-btn{background:var(--panel-light);border:1px solid var(--copper);color:var(--text);width:40px;height:40px;font-size:18px;border-radius:6px;transition:all .15s}
.icon-btn:hover{background:var(--copper)}
.icon-btn:active{transform:scale(.94)}
.stats{display:flex;gap:12px;flex:1;justify-content:center;flex-wrap:nowrap}
.stat{display:flex;flex-direction:column;gap:4px;min-width:150px;background:rgba(45,66,96,.8);padding:6px 12px;border-radius:6px;border:1px solid rgba(184,115,51,.3);cursor:help;transition:border-color .2s}
.stat:hover{border-color:var(--amber)}
.stat-head{display:flex;align-items:baseline;gap:6px}
.stat-icon{font-size:13px}
.stat-label{font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;flex:1}
.stat-value{font-family:'Consolas','Monaco',monospace;font-size:17px;font-weight:700;color:var(--gold)}
.stat-hint{font-size:9px;color:var(--text-dim);opacity:.7;margin-top:2px}
.stat-bar{height:5px;background:rgba(0,0,0,.4);border-radius:3px;overflow:hidden;position:relative}
.stat-bar-fill{height:100%;background:var(--green);transition:width .5s cubic-bezier(.4,0,.2,1),background .3s;border-radius:3px}
.stat-bar-goal{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--gold);left:50%;box-shadow:0 0 6px var(--gold)}
.day-info{font-size:13px;color:var(--amber);font-weight:700}
.year-info{font-size:11px;color:var(--text-dim)}

.camera-controls{position:fixed;top:88px;left:16px;z-index:15;display:flex;gap:8px}
.camera-controls button{pointer-events:auto;background:rgba(36,52,71,.9);border:1px solid var(--copper);color:var(--text);padding:8px 14px;border-radius:6px;font-size:12px;backdrop-filter:blur(4px);transition:all .15s}
.camera-controls button:hover{background:var(--copper);transform:translateY(-1px)}

.bottom-panel{pointer-events:auto;margin-top:auto;height:72px;background:linear-gradient(0deg,rgba(36,52,71,.95),rgba(36,52,71,.85));backdrop-filter:blur(8px);border-top:2px solid var(--copper);display:flex;align-items:center;padding:0 20px;gap:14px;box-shadow:0 -2px 20px rgba(0,0,0,.5)}
.turn-info{display:flex;flex-direction:column;gap:4px;flex:1}
.turn-info-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}
.attention-dots{display:flex;gap:6px;align-items:center;margin-top:4px}
.attention-dot{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(232,163,61,.7);transition:all .3s}
.attention-dot.used{background:rgba(154,165,177,.3);box-shadow:none}
.btn-end-turn{background:linear-gradient(180deg,var(--amber),var(--copper));color:#1a2332;border:none;padding:14px 32px;font-size:15px;font-weight:700;border-radius:8px;transition:all .15s;letter-spacing:1px;box-shadow:0 4px 20px rgba(232,163,61,.4)}
.btn-end-turn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 30px rgba(232,163,61,.6)}
.btn-end-turn:active:not(:disabled){transform:scale(.97)}
.btn-end-turn:disabled{opacity:.4;cursor:not-allowed}
.btn-end-turn.highlighted{animation:endPulse 1.6s ease-in-out infinite}
@keyframes endPulse{0%,100%{box-shadow:0 0 0 3px var(--gold),0 0 25px var(--gold)}50%{box-shadow:0 0 0 6px var(--gold),0 0 40px var(--gold)}}

.modal-root{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:500;animation:fadeIn .2s ease;backdrop-filter:blur(3px);pointer-events:auto}
.modal-content{background:var(--panel);border:1px solid var(--copper);border-radius:12px;max-width:560px;width:92%;max-height:85vh;overflow-y:auto;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.8);animation:modalIn .3s cubic-bezier(.34,1.56,.64,1);position:relative}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-close{position:absolute;top:12px;right:12px;background:transparent;border:none;color:var(--text-dim);font-size:22px;width:32px;height:32px;border-radius:6px;transition:all .15s}
.modal-close:hover{background:var(--panel-light);color:var(--text)}
.modal-title{font-family:Georgia,serif;font-size:22px;color:var(--amber);margin-bottom:12px;padding-right:30px;display:flex;align-items:center;gap:10px}
.modal-body{color:var(--text);line-height:1.6;margin-bottom:16px;font-size:14px}
.modal-cause{background:rgba(212,84,84,.15);border-left:3px solid var(--red);padding:10px 12px;margin:12px 0;border-radius:4px;font-size:13px}
.modal-cause.ok{background:rgba(107,163,104,.15);border-color:var(--green)}
.modal-loss{font-size:20px;font-weight:700;color:var(--red);margin:8px 0}
.modal-loss.low{color:var(--amber)}
.modal-loss.zero{color:var(--green)}
.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.btn-modal{background:var(--panel-light);border:1px solid var(--copper);color:var(--text);padding:12px 10px;font-size:13px;border-radius:6px;transition:all .15s;display:flex;flex-direction:column;gap:2px;align-items:center;text-align:center}
.btn-modal:hover:not(:disabled){background:var(--copper);transform:translateY(-1px)}
.btn-modal:disabled{opacity:.35;cursor:not-allowed}
.btn-modal-cost{font-size:11px;color:var(--text-dim)}
.btn-modal.primary{background:linear-gradient(180deg,var(--amber),var(--copper));color:#1a2332;border:none;font-weight:700}
.btn-modal.primary .btn-modal-cost{color:rgba(26,35,50,.7)}
.modal-advisor{background:rgba(232,163,61,.15);border-left:3px solid var(--amber);padding:10px 12px;margin-top:14px;font-size:13px;line-height:1.5;border-radius:4px}
.modal-advisor b{color:var(--amber)}

.talk-portrait{font-size:64px;text-align:center;margin-bottom:8px;animation:letterBounce .6s ease}
@keyframes letterBounce{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.talk-name{text-align:center;color:var(--amber);font-weight:700;font-size:15px;margin-bottom:10px}
.talk-text{background:rgba(45,66,96,.5);border-left:3px solid var(--copper);border-radius:6px;padding:14px 16px;font-size:14px;line-height:1.6;margin-bottom:14px;font-style:italic;position:relative}
.talk-text::before{content:'«';position:absolute;left:4px;top:0;font-size:32px;color:var(--copper);opacity:.5;line-height:1}
.talk-text::after{content:'»';position:absolute;right:6px;bottom:-8px;font-size:32px;color:var(--copper);opacity:.5;line-height:1}
.talk-replies{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.talk-reply{background:var(--panel-light);border:1px solid var(--copper);color:var(--text);padding:12px 14px;border-radius:6px;font-size:13px;text-align:left;transition:all .15s;display:flex;justify-content:space-between;align-items:center;gap:8px}
.talk-reply:hover{background:var(--copper);transform:translateX(3px)}
.talk-reply-effect{font-size:11px;color:var(--gold);font-weight:700;white-space:nowrap}

.help-section{margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid rgba(184,115,51,.2)}
.help-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.help-section h3{color:var(--amber);font-size:15px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.help-section p{font-size:13px;line-height:1.65;color:var(--text);margin-bottom:6px}
.help-section p b{color:var(--gold)}
.help-section .help-icon{font-size:18px}

.advisor{position:fixed;bottom:92px;right:20px;max-width:340px;background:var(--panel);border:2px solid var(--amber);border-radius:12px;padding:14px 16px 14px 60px;box-shadow:0 12px 40px rgba(0,0,0,.7),0 0 25px rgba(232,163,61,.4);z-index:600;animation:advisorIn .4s cubic-bezier(.34,1.56,.64,1);font-size:13px;line-height:1.5;pointer-events:auto}
@keyframes advisorIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.advisor-icon{position:absolute;left:12px;top:12px;font-size:32px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));animation:advisorBob 2s ease-in-out infinite}
@keyframes advisorBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.advisor-btn{background:var(--amber);color:#1a2332;border:none;padding:8px 16px;border-radius:6px;font-weight:700;font-size:13px;margin-top:10px;transition:all .15s}
.advisor-btn:hover{background:var(--gold)}
.advisor-btn:active{transform:scale(.97)}

.tooltip{position:fixed;background:var(--red);color:#fff;padding:8px 14px;border-radius:6px;font-size:13px;font-weight:500;z-index:1000;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.6);animation:fadeIn .2s;transform:translate(-50%,-100%);margin-top:-8px;white-space:nowrap}
.tooltip.info{background:var(--panel-light);border:1px solid var(--amber);color:var(--text);white-space:normal;max-width:280px;text-align:left;font-weight:400;line-height:1.5;font-size:12px}

.turn-banner{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,var(--amber),var(--copper));color:#1a2332;padding:14px 48px;border-radius:12px;font-size:17px;font-weight:700;z-index:700;box-shadow:0 8px 40px rgba(0,0,0,.7);animation:bannerIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes bannerIn{from{opacity:0;transform:translateX(-50%) translateY(-30px) scale(.9)}to{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}

.float-text{position:fixed;font-size:22px;font-weight:700;pointer-events:none;z-index:800;animation:floatUp 1.4s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.8)}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-80px) scale(1.2)}}

.letter-portrait{font-size:64px;text-align:center;margin-bottom:14px;animation:letterBounce .6s ease}
.letter-sign{text-align:right;color:var(--text-dim);font-style:italic;margin-top:12px;font-size:13px}

.encyclopedia{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
.ency-card{background:var(--panel-light);border:1px solid rgba(184,115,51,.4);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.4}
.ency-card.locked{opacity:.4}
.ency-card-title{color:var(--amber);font-weight:700;margin-bottom:4px;font-size:13px}
.ency-card-text{color:var(--text);font-size:12px}
.ency-card-source{color:var(--text-dim);font-size:10px;margin-top:6px;font-style:italic}

.ending-screen{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:40px;animation:fadeIn 1.2s ease;overflow-y:auto;pointer-events:auto}
.ending-screen.resonance{background:radial-gradient(circle at 50% 40%,rgba(232,163,61,.5) 0%,#1a2332 75%)}
.ending-screen.showcase{background:radial-gradient(circle at 50% 40%,rgba(92,139,158,.5) 0%,#0f1820 75%)}
.ending-screen.warmth{background:radial-gradient(circle at 50% 40%,rgba(232,163,61,.4) 0%,#241a10 75%)}
.ending-screen.compromise{background:radial-gradient(circle at 50% 40%,rgba(154,165,177,.3) 0%,#1a2332 75%)}
.ending-screen.fail-heat{background:radial-gradient(circle at 50% 40%,rgba(212,84,84,.6) 0%,#1a0000 75%)}
.ending-screen.fail-budget{background:radial-gradient(circle at 50% 40%,rgba(90,90,90,.6) 0%,#0a0a0a 75%)}
.ending-content{max-width:660px;text-align:center}
.ending-title{font-family:Georgia,serif;font-size:48px;color:var(--amber);margin-bottom:24px;letter-spacing:6px;text-shadow:0 4px 40px rgba(232,163,61,.7)}
.ending-text{font-size:18px;line-height:1.7;margin-bottom:32px;color:var(--text)}
.ending-buttons{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:32px}

.diary-screen{position:fixed;inset:0;background:#000;z-index:950;display:flex;align-items:center;justify-content:center;padding:60px;animation:fadeIn 3s ease;pointer-events:auto}
.diary-content{max-width:620px}
.diary-text{font-family:'Segoe Script','Brush Script MT',Georgia,serif;font-size:22px;font-style:italic;line-height:1.9;color:#e8dcc4;white-space:pre-line}
.diary-line{opacity:0;animation:diaryLineIn 1.2s ease forwards}
@keyframes diaryLineIn{to{opacity:1}}
.titr{position:fixed;bottom:40px;left:0;right:0;text-align:center;font-size:12px;color:var(--text-dim);animation:fadeIn 2s ease 2s both}

@media(max-width:768px){
  .top-panel{height:auto;flex-wrap:wrap;padding:8px;gap:8px}
  .stats{order:3;width:100%;overflow-x:auto;justify-content:flex-start;padding-bottom:4px}
  .stat{min-width:120px;flex-shrink:0}
  .bottom-panel{height:auto;flex-wrap:wrap;padding:10px;gap:10px}
  .btn-end-turn{width:100%}
  .advisor{right:8px;left:8px;bottom:110px;max-width:none}
  .start-title{font-size:64px;letter-spacing:8px}
  .ending-title{font-size:32px}
  .encyclopedia{grid-template-columns:1fr}
  .modal-actions{grid-template-columns:1fr}
  .camera-controls{top:auto;bottom:200px;left:8px}
}
</style>
</head>
<body>

<div id="loader">БАЛАНС</div>

<div id="startScreen" class="start-screen hidden">
  <div class="start-content">
    <h1 class="start-title">БАЛАНС</h1>
    <p class="start-subtitle">3D-симулятор энергосистемы региона</p>
    <p class="start-desc">Вы — главный инженер. 5 лет. Цель — снизить энергоёмкость на 30%. Не забывайте о людях.</p>
    <div class="start-buttons">
      <button id="btnStart" class="btn-start">Начать</button>
      <button id="btnReset" class="btn-reset hidden">Сбросить прогресс</button>
    </div>
  </div>
</div>

<div id="gameUI" class="game-ui hidden">
  <header class="top-panel">
    <div class="top-left">
      <button id="btnHelp" class="icon-btn" aria-label="Помощь">❓</button>
      <button id="btnEncyclopedia" class="icon-btn" aria-label="Справочник">📖</button>
      <button id="btnSound" class="icon-btn" aria-label="Звук">🔊</button>
      <button id="btnResetGame" class="icon-btn" aria-label="Сброс">🔄</button>
    </div>
    <div class="stats">
      <div class="stat" id="budgetStat">
        <div class="stat-head"><span class="stat-icon">💰</span><span class="stat-label">Бюджет</span><span class="stat-value" id="budgetValue">150</span></div>
        <div class="stat-bar"><div class="stat-bar-fill" id="budgetBar" style="width:62%"></div></div>
        <div class="stat-hint">деньги на ремонт и стройки</div>
      </div>
      <div class="stat" id="heatStat">
        <div class="stat-head"><span class="stat-icon">🧡</span><span class="stat-label">Люди</span><span class="stat-value" id="heatValue">100</span></div>
        <div class="stat-bar"><div class="stat-bar-fill" id="heatBar" style="width:100%"></div></div>
        <div class="stat-hint">доверие — ниже 25 = провал</div>
      </div>
      <div class="stat" id="energyStat">
        <div class="stat-head"><span class="stat-icon">📉</span><span class="stat-label">Энергоёмкость</span><span class="stat-value" id="energyValue">100</span></div>
        <div class="stat-bar"><div class="stat-bar-fill" id="energyBar" style="width:0%;background:var(--cold)"></div><div class="stat-bar-goal"></div></div>
        <div class="stat-hint">цель ≤ 70 к 20-му ходу</div>
      </div>
    </div>
    <div class="top-right">
      <div class="day-info" id="dayInfo">День 1/20</div>
      <div class="year-info" id="yearInfo">Год 1, Весна</div>
    </div>
  </header>

  <div class="camera-controls">
    <button id="btnOverview" title="Вернуться к обзору">🏙 Обзор</button>
  </div>

  <footer class="bottom-panel">
    <div class="turn-info">
      <div class="turn-info-label">Действия в этом ходу</div>
      <div class="attention-dots" id="attentionDots"></div>
    </div>
    <button id="btnEndTurn" class="btn-end-turn">Завершить ход →</button>
  </footer>
</div>

<div id="modalRoot" class="modal-root hidden">
  <div id="modalContent" class="modal-content"></div>
</div>

<div id="advisor" class="advisor hidden"></div>
<div id="tooltip" class="tooltip hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
'use strict';

const SAVE_KEY = 'balans3d_save_v3';
const SEASON_NAMES = ['Весна','Лето','Осень','Зима'];
const SEASON_ORDER = ['spring','summer','autumn','winter'];

// ============================================================
// ДАННЫЕ ОБЪЕКТОВ (Обновлённые позиции)
// ============================================================
const OBJECTS_INITIAL = [
  // Верхний ряд (Z = -5)
  {id:'tec',type:'source',name:'ТЭЦ',icon:'🏭',pos:[-9,0,-5],loss:55,repairCost:30,repairEffect:12,repairHeatImpact:-3,buildOptions:[],causeText:'Изношенные теплообменники и отсутствие изоляции.',factId:'fact_tec'},
  {id:'boiler1',type:'source',name:'Котельная №1',icon:'🔥',pos:[-3,0,-5],loss:40,repairCost:20,repairEffect:8,repairHeatImpact:-2,buildOptions:[],causeText:'Устаревшие горелки, низкий КПД.',factId:'fact_boiler1'},
  {id:'boiler2',type:'source',name:'Котельная №2',icon:'🔥',pos:[3,0,-5],loss:35,repairCost:20,repairEffect:8,repairHeatImpact:-2,buildOptions:[],causeText:'Накипь в трубах, потеря давления.',factId:'fact_boiler2'},
  {id:'boiler3',type:'source',name:'Котельная №3',icon:'🔥',pos:[9,0,-5],loss:30,repairCost:18,repairEffect:7,repairHeatImpact:-1,buildOptions:[],causeText:'Отсутствие автоматики регулирования.',factId:'fact_boiler3'},

const $ = s=>document.querySelector(s);
const clamp = (v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const sleep = ms=>new Promise(r=>setTimeout(r,ms));

function saveGame(){ try{localStorage.setItem(SAVE_KEY,JSON.stringify(state))}catch(e){} }
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw)return null;
    const parsed = JSON.parse(raw);
    const defaults = createDefaultState();
    const merged = Object.assign(defaults,parsed);
    merged.flags = Object.assign(defaults.flags,parsed.flags||{});
    merged.ui = Object.assign(defaults.ui,parsed.ui||{});
    merged.builds = Object.assign(defaults.builds,parsed.builds||{});
    if(!Array.isArray(merged.objects)||merged.objects.length===0)merged.objects=cloneObjects();
    if(!Array.isArray(merged.unlockedFacts))merged.unlockedFacts=['fact_kwh', 'fact_sub'];
    if(!Array.isArray(merged.pendingEffects))merged.pendingEffects=[];
    return merged;
  }catch(e){return null}
}
function resetGame(){ try{localStorage.removeItem(SAVE_KEY)}catch(e){} state=createDefaultState(); }
function unlockFact(id){ if(state.unlockedFacts.indexOf(id)<0)state.unlockedFacts.push(id); }

function recalcEnergyIntensity(){
  const current = state.objects.reduce((s,o)=>s+o.loss,0);
  let base = 100 - (BASELINE_LOSS - current) / 3;
  let bonus = 0;
  if(state.builds.biogas)bonus+=6;
  if(state.builds.wood_chips)bonus+=7;
  if(state.builds.sorting)bonus+=5;
  if(state.builds.solar)bonus+=8;
  if(state.builds.smart_meter)bonus+=4;
  bonus += state.builds.insulation * 3;
  state.energyIntensity = clamp(base - bonus, 40, 100);
}

let audioCtx = null;
function getAudio(){ if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null} } return audioCtx; }
function playSound(type){
  if(!state.ui.soundOn)return;
  const ctx = getAudio(); if(!ctx)return;
  try{
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    const t = ctx.currentTime;
    switch(type){
      case 'click': osc.type='sine'; osc.frequency.setValueAtTime(440,t); gain.gain.setValueAtTime(.08,t); gain.gain.exponentialRampToValueAtTime(.001,t+.05); osc.start(t); osc.stop(t+.05); break;
      case 'repair': osc.type='sine'; osc.frequency.setValueAtTime(660,t); osc.frequency.linearRampToValueAtTime(880,t+.2); gain.gain.setValueAtTime(.1,t); gain.gain.exponentialRampToValueAtTime(.001,t+.2); osc.start(t); osc.stop(t+.2); break;
      case 'error': osc.type='square'; osc.frequency.setValueAtTime(220,t); gain.gain.setValueAtTime(.08,t); gain.gain.exponentialRampToValueAtTime(.001,t+.15); osc.start(t); osc.stop(t+.15); break;
      case 'leak': osc.type='triangle'; osc.frequency.setValueAtTime(880,t); gain.gain.setValueAtTime(.1,t); gain.gain.exponentialRampToValueAtTime(.001,t+.1); osc.start(t); osc.stop(t+.1); break;
      case 'letter': osc.type='sine'; osc.frequency.setValueAtTime(523,t); gain.gain.setValueAtTime(.08,t); osc.frequency.setValueAtTime(659,t+.15); gain.gain.setValueAtTime(.08,t+.15); gain.gain.exponentialRampToValueAtTime(.001,t+.35); osc.start(t); osc.stop(t+.35); break;
      case 'turn': osc.type='sine'; osc.frequency.setValueAtTime(330,t); osc.frequency.linearRampToValueAtTime(440,t+.3); gain.gain.setValueAtTime(.08,t); gain.gain.exponentialRampToValueAtTime(.001,t+.3); osc.start(t); osc.stop(t+.3); break;
      case 'good': osc.type='sine'; osc.frequency.setValueAtTime(523,t); gain.gain.setValueAtTime(.08,t); gain.gain.exponentialRampToValueAtTime(.001,t+1.5); osc.start(t); osc.stop(t+1.5); break;
      case 'bad': osc.type='sine'; osc.frequency.setValueAtTime(220,t); gain.gain.setValueAtTime(.08,t); gain.gain.exponentialRampToValueAtTime(.001,t+1.5); osc.start(t); osc.stop(t+1.5); break;
    }
  }catch(e){}
}

const hRoads = [-8, -2, 4, 10];
const vRoads = [-12, -6, 0, 6, 12];

function buildRoads(){
  const roadMat = new THREE.MeshStandardMaterial({color:0x222228, roughness:0.95});
  const sidewalkMat = new THREE.MeshStandardMaterial({color:0x5a5a60, roughness:0.9});
  const grassMat = new THREE.MeshStandardMaterial({color:0x3a5a3a, roughness:1.0});
  const lineMat = new THREE.MeshBasicMaterial({color:0xe8d878, transparent:true, opacity:0.6});

  // Дороги
  hRoads.forEach(z=>{
    const road = new THREE.Mesh(new THREE.PlaneGeometry(36, 1.6), roadMat);
    road.rotation.x = -Math.PI/2;
    road.position.set(0, 0.02, z);
    road.receiveShadow = true;
    scene.add(road);
    
    [-0.85, 0.85].forEach(off=>{
      const s = new THREE.Mesh(new THREE.BoxGeometry(36, 0.08, 0.15), sidewalkMat);
      s.position.set(0, 0.04, z + off);
      s.receiveShadow = true;
      scene.add(s);
    });
    
    for(let x=-18; x<=18; x+=1.5){
      if (vRoads.some(vx => Math.abs(x - vx) < 1.5)) continue;
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.08), lineMat);
      dash.rotation.x = -Math.PI/2;
      dash.position.set(x, 0.03, z);
      scene.add(dash);
    }
  });

  vRoads.forEach(x=>{
    const road = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 24), roadMat);
    road.rotation.x = -Math.PI/2;
    road.position.set(x, 0.02, 1);
    road.receiveShadow = true;
    scene.add(road);
    
    [-0.85, 0.85].forEach(off=>{
      const s = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.08, 24), sidewalkMat);
      s.position.set(x + off, 0.04, 1);
      s.receiveShadow = true;
      scene.add(s);
    });
    
    for(let z=-12; z<=14; z+=1.5){
      if (hRoads.some(hz => Math.abs(z - hz) < 1.5)) continue;
      const dash = new THREE.Mesh(new THREE.PlaneGeometry(0.08, 0.6), lineMat);
      dash.rotation.x = -Math.PI/2;
      dash.position.set(x, 0.03, z);
      scene.add(dash);
    }
  });

  // Перекрёстки (Зебры)
  function drawCrosswalk(cx, cz, isH) {
      for(let i = -0.6; i <= 0.6; i += 0.3) {
          const line = new THREE.Mesh(new THREE.PlaneGeometry(isH ? 0.15 : 0.8, isH ? 0.8 : 0.15), lineMat);
          line.rotation.x = -Math.PI/2;
          line.position.set(cx + (isH ? i : 0), 0.035, cz + (isH ? 0 : i));
          scene.add(line);
      }
  }
  hRoads.forEach(z => {
      vRoads.forEach(x => {
          drawCrosswalk(x, z - 1.25, false);
          drawCrosswalk(x, z + 1.25, false);
          drawCrosswalk(x - 1.25, z, true);
          drawCrosswalk(x + 1.25, z, true);
      });
  });

  // Кварталы (блоки)
  const blockX = [-9, -3, 3, 9];
  const blockZ = [-5, 1, 7, 13];
  
  blockX.forEach(x => {
      blockZ.forEach(z => {
          // Бетонная плита
          const base = new THREE.Mesh(new THREE.BoxGeometry(6, 0.1, 6), sidewalkMat);
          base.position.set(x, 0.05, z);
          base.receiveShadow = true;
          scene.add(base);
          // Трава внутри
          const grass = new THREE.Mesh(new THREE.BoxGeometry(5.6, 0.11, 5.6), grassMat);
          grass.position.set(x, 0.055, z);
          grass.receiveShadow = true;
          scene.add(grass);
      });
  });
}

function makeTree(x, z, scale){

function buildVegetation(){
  // Деревья по краям и в пустых кварталах
  const spots = [];
  
  // Периметр
  for(let x=-20; x<=20; x+=2){
    spots.push({x, z:-15 + Math.random()*1.5});
    spots.push({x, z:18 + Math.random()*1.5});
  }
  for(let z=-14; z<=17; z+=2){
    spots.push({x:-20 + Math.random()*1.5, z});
    spots.push({x:19 + Math.random()*1.5, z});
  }
  
  // Пустой квартал (9, 13)
  for(let i=0; i<5; i++) {
      spots.push({x: 9 + (Math.random()-0.5)*3, z: 13 + (Math.random()-0.5)*3});
  }

  spots.forEach(s=>{
    if(Math.random() < 0.9){
      const tree = makeTree(s.x, s.z, 0.85 + Math.random()*0.4);
      scene.add(tree);
    }
  });
}

function buildDistantScenery() {
    // Горы на фоне
    const mountainMat = new THREE.MeshStandardMaterial({color: 0x2a3a4a, roughness: 0.9});
    for(let i=0; i<40; i++) {
        const angle = (i / 40) * Math.PI * 2;
        const dist = 45 + Math.random() * 15;
        const x = Math.cos(angle) * dist;
        const z = Math.sin(angle) * dist;
        const h = 10 + Math.random() * 15;

        m.position.set(x, h/2, z);
        m.rotation.y = Math.random() * Math.PI;
        scene.add(m);
    }
}

  const positions = [];
  hRoads.forEach(z=>{
    for(let x=-15; x<=15; x+=7){

function makeLabelSprite(name, icon){
  const canvas = document.createElement('canvas');
  canvas.width = 320; canvas.height = 96;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = 'rgba(26,35,50,0.92)';
  roundRect(ctx, 4, 4, 312, 88, 12); ctx.fill();
  ctx.strokeStyle = '#b87333'; ctx.lineWidth = 3;
  roundRect(ctx, 4, 4, 312, 88, 12); ctx.stroke();
  ctx.fillStyle = '#e8dcc4';
  ctx.font = 'bold 26px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(icon + ' ' + name, 160, 48);
  const tex = new THREE.CanvasTexture(canvas);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({map:tex, depthTest:false, transparent:true});
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(4.2, 1.26, 1);
  sprite.renderOrder = 999;
  return sprite;
}
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.arcTo(x+w, y, x+w, y+h, r); ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r); ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

class SmokeEmitter {
  constructor(scene, position, isDark){
    this.scene = scene;
    this.position = position.clone();
    this.isDark = isDark;
    this.rate = 0;
    this.particles = [];
    for(let i=0;i<12;i++){
      const mat = new THREE.MeshBasicMaterial({color: isDark ? 0x444444 : 0xc0c8d0, transparent:true, opacity:0, depthWrite:false});
      const p = new THREE.Mesh(new THREE.SphereGeometry(0.25, 6, 6), mat);
      p.position.copy(position); p.visible = false;
      this.scene.add(p);
      this.particles.push({mesh:p, life:0, maxLife:1, vy:0.6+Math.random()*0.4});
    }
  }
  setRate(r){ this.rate = clamp(r, 0, 1); }
  update(dt){
    this.particles.forEach(p=>{
      if(p.life<=0){
        if(Math.random() < this.rate * dt * 3){
          p.life = p.maxLife = 1.2 + Math.random()*1.2;
          p.mesh.position.copy(this.position);
          p.mesh.position.x += (Math.random()-0.5)*0.4;
          p.mesh.position.z += (Math.random()-0.5)*0.4;
          p.mesh.scale.setScalar(0.5);
          p.mesh.visible = true;
          p.mesh.material.opacity = 0.6;
        }
      } else {
        p.life -= dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.x += (Math.random()-0.5) * dt * 0.3;
        const t = 1 - p.life/p.maxLife;
        p.mesh.material.opacity = 0.6 * (1 - t);
        p.mesh.scale.setScalar(0.5 + t * 1.8);
        if(p.life<=0) p.mesh.visible = false;
      }
    });
  }
}

function buildCity(){
  state.objects.forEach(obj=>{
    let group;
    switch(obj.id){
      case 'tec': group = buildTEC(); break;
      case 'boiler1': case 'boiler2': group = buildBoiler(1); break;
      case 'boiler3': group = buildBoiler(0.9); break;
      case 'substation_a': case 'substation_b': case 'substation_v': case 'substation_g': group = buildSubstation(); break;
      case 'promzone': group = buildIndustrial(); break;
      case 'res1': case 'res2': case 'res3': case 'res4': case 'res5': group = buildResidential(); break;
      case 'school': group = buildSchool(); break;
      case 'agro': group = buildFarm(); break;
      case 'les': group = buildForest(); break;
      case 'dump': group = buildDump(); break;
      default: group = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), getMat('default', 0x8a8a8a));
    }
    group.position.set(obj.pos[0], 0, obj.pos[2]);

    const label = makeLabelSprite(obj.name, obj.icon);
    label.position.set(0, 6.5, 0);
    group.add(label);

    let smoke = null;
    if(obj.type === 'source'){
      const chimneyY = obj.id==='tec' ? 8 : 5;
      const chimneyX = obj.id==='tec' ? -1.2 : 0.7;
      const pos = new THREE.Vector3(obj.pos[0]+chimneyX, chimneyY, obj.pos[2]-1);
      smoke = new SmokeEmitter(scene, pos, true);
    }

    group.userData.objectId = obj.id;
    group.userData.obj = obj;
    scene.add(group);

    cityObjects[obj.id] = {group, label, smoke, obj};

    group.scale.set(0.01, 0.01, 0.01);
    activeAnimations.push({obj: group, start: performance.now(), duration: 700, target: new THREE.Vector3(1,1,1)});
  });

  updateCityVisuals();
}

function updateCityVisuals(){
  state.objects.forEach(obj=>{
    const co = cityObjects[obj.id];
    if(!co) return;

    if(co.smoke){
      const lossRatio = obj.loss / 60;
      co.smoke.setRate(obj.studied || state.flags.tutorialDone ? lossRatio : lossRatio * 0.5);
      co.smoke.particles.forEach(p=>{
        p.mesh.material.color.setHex(obj.loss > 20 ? 0x333333 : obj.loss > 5 ? 0x777777 : 0xc0c8d0);
      });
    }

    if(obj.type === 'consumer'){
      co.group.traverse(child=>{
        if(child.userData.isWindow){
          if(obj.loss > 15) child.material.color.setHex(0x3a3a4a);
          else if(obj.loss > 5) child.material.color.setHex(0xd0a040);
          else child.material.color.setHex(0xffe080);
        }
      });
    }
  });

  const cols = SEASON_COLORS[state.season];
  if(scene.userData.sun){
    scene.userData.sun.color.setHex(cols.sun);
    scene.userData.hemi.color.setHex(cols.sky);
    scene.background.setHex(cols.sky);
    scene.fog.color.setHex(cols.fog);
  }
  const groundMesh = scene.getObjectByName('ground');
  if(groundMesh) groundMesh.material.color.setHex(cols.ground);
}

class Person {
  constructor(){
    const g = new THREE.Group();
    const colors = [0x4060a0, 0xa04040, 0x40a060, 0x8060a0, 0xa08040, 0x506080];
    const color = colors[Math.floor(Math.random()*colors.length)];
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.13, 0.45, 6), new THREE.MeshStandardMaterial({color}));
    body.position.y = 0.225; body.castShadow = true; g.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 6), new THREE.MeshStandardMaterial({color:0xf0c080}));
    head.position.y = 0.54; head.castShadow = true; g.add(head);
    
    // Спавн на тротуарах
    const axis = Math.random() < 0.5 ? 'x' : 'z';
    this.axis = axis;
    if(axis === 'x') {
        this.fixed = hRoads[Math.floor(Math.random()*hRoads.length)] + 0.85;
        this.pos = (Math.random()-0.5) * 28;
    } else {
        this.fixed = vRoads[Math.floor(Math.random()*vRoads.length)] + 0.85;
        this.pos = -8 + Math.random()*20;
    }
    g.position.set(axis==='x'?this.pos:this.fixed, 0, axis==='z'?this.pos:this.fixed);
    scene.add(g);
    this.mesh = g;
    this.dir = Math.random() < 0.5 ? 1 : -1;
    this.speed = 0.5 + Math.random() * 0.5;
    this.bobPhase = Math.random() * Math.PI * 2;
  }
  update(dt){
    this.pos += this.dir * this.speed * dt;
    if(this.axis === 'x'){
      if(this.pos > 16 || this.pos < -16) this.dir *= -1;
      this.mesh.position.x = this.pos;
      this.mesh.rotation.y = this.dir > 0 ? Math.PI/2 : -Math.PI/2;
    } else {
      if(this.pos > 14 || this.pos < -10) this.dir *= -1;
      this.mesh.position.z = this.pos;
      this.mesh.rotation.y = this.dir > 0 ? 0 : Math.PI;
    }
    this.mesh.position.y = Math.abs(Math.sin(performance.now()*0.008 + this.bobPhase)) * 0.04;
  }
}

function focusOnObject(id){
  const co = cityObjects[id];
  if(!co) return;
  const p = co.group.position;
  cam.targetPos.set(p.x + 6, 5.5, p.z + 6);
  cam.targetLook.set(p.x, 2, p.z);
  cam.mode = 'focus';
  selectionRing.mesh.position.set(p.x, 0.05, p.z);
  selectionRing.mesh.visible = true;
  selectionRing.objId = id;
}

function returnToOverview(){
  cam.targetPos.set(18, 20, 18);
  cam.targetLook.set(0, 1, 0);
  cam.mode = 'overview';
  selectionRing.mesh.visible = false;
  selectionRing.objId = null;
  state.ui.selectedObjectId = null;
}

async function cinematicAction(id, actionFn){
  const co = cityObjects[id];
  if(!co) return;
  const p = co.group.position;
  cam.targetPos.set(p.x + 3.5, 3.5, p.z + 3.5);
  cam.targetLook.set(p.x, 2, p.z);
  await sleep(500);
  actionFn();
  spawnBurst(p.x, 3, p.z);
  await sleep(700);
  cam.targetPos.set(p.x + 6, 5.5, p.z + 6);
  cam.targetLook.set(p.x, 2, p.z);
}

function spawnBurst(x, y, z){
  for(let i=0;i<25;i++){
    const mat = new THREE.MeshBasicMaterial({color:0xffd966, transparent:true, opacity:1});
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.1, 4, 4), mat);
    m.position.set(x, y, z);
    const vel = new THREE.Vector3((Math.random()-0.5)*6, Math.random()*5 + 2, (Math.random()-0.5)*6);
    scene.add(m);
    const start = performance.now();
    const anim = ()=>{
      const t = (performance.now()-start)/1000;
      if(t>1.2){ scene.remove(m); return; }
      m.position.x += vel.x * 0.016;
      m.position.y += vel.y * 0.016 - 6*t*0.016;
      m.position.z += vel.z * 0.016;
      m.material.opacity = 1 - t/1.2;
      requestAnimationFrame(anim);
    };
    anim();
  }
}

function onCanvasClick(e){
  if(state.ui.isAnimating) return;
  if(state.ui.activeModal) return;
  if(!$('#startScreen').classList.contains('hidden')) return;

  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const clickables = [];
  Object.values(cityObjects).forEach(co=>{
    co.group.traverse(child=>{ if(child.isMesh) clickables.push(child); });
  });

  const hits = raycaster.intersectObjects(clickables, false);
  if(hits.length > 0){
    let obj = hits[0].object;
    while(obj && !obj.userData.objectId) obj = obj.parent;
    if(obj && obj.userData.objectId){
      onObjectClick(obj.userData.objectId);
      return;
    }
  }
  if(cam.mode !== 'overview') returnToOverview();
}

function onObjectClick(id){
  const co = cityObjects[id];
  if(!co) return;

  if(!state.flags.tutorialDone){
    const step = state.tutorialStep;
    const target = getHighlightTarget();
    if(target && id !== target) return;
    if(!target) return;
    if(step===2 && id==='tec'){ state.tutorialStep = 3; focusOnObject(id); state.ui.selectedObjectId = id; setTimeout(()=>openObjectModal(id), 400); render(); return; }
    if((step===3||step===4) && id==='tec'){ focusOnObject(id); state.ui.selectedObjectId = id; openObjectModal(id); render(); return; }
    if((step===6||step===7) && id==='substation_b'){ focusOnObject(id); state.ui.selectedObjectId = id; openObjectModal(id); render(); return; }
    if((step===8||step===9) && id==='res1'){ focusOnObject(id); state.ui.selectedObjectId = id; openObjectModal(id); render(); return; }
    return;
  }
  focusOnObject(id);
  state.ui.selectedObjectId = id;
  render();
  setTimeout(()=>openObjectModal(id), 500);
}

function showInfoTooltip(text, el){

  tip.textContent = text;
  tip.classList.add('info');
  const rect = el.getBoundingClientRect();
  tip.style.left = (rect.left + rect.width/2) + 'px';
  tip.style.top = (rect.top - 10) + 'px';
  tip.classList.remove('hidden');
  clearTimeout(tooltipTimer);
  tooltipTimer = setTimeout(()=>tip.classList.add('hidden'), 4000);
}
function floatText(text, x, y, color){
  const el = document.createElement('div');
  el.className = 'float-text';
  el.textContent = text;
  el.style.left = x+'px';
  el.style.top = y+'px';
  el.style.color = color||'var(--gold)';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1400);
}

// ============================================================
function render(){
  renderStats();
  renderAttentionDots();
  renderAdvisor();
  updateCityVisuals();
}

function renderStats(){
  $('#budgetValue').textContent = Math.round(state.budget);
  $('#heatValue').textContent = Math.round(state.heatForPeople);
  $('#energyValue').textContent = Math.round(state.energyIntensity);
  $('#dayInfo').textContent = `День ${Math.min(state.turn,20)}/20`;
  $('#yearInfo').textContent = `Год ${state.year}, ${SEASON_NAMES[SEASON_ORDER.indexOf(state.season)]}`;

  const bPct = clamp((state.budget+100)/400*100,0,100);
  const bBar = $('#budgetBar');
  bBar.style.width = bPct+'%';
  bBar.style.background = state.budget<0?'var(--red)':'var(--green)';

  const hBar = $('#heatBar');
  hBar.style.width = clamp(state.heatForPeople,0,100)+'%';
  hBar.style.background = state.heatForPeople<40?'var(--red)':state.heatForPeople<70?'var(--amber)':'var(--green)';

  const ePct = clamp((100-state.energyIntensity)/60*100,0,100);
  const eBar = $('#energyBar');
  eBar.style.width = ePct+'%';
  eBar.style.background = state.energyIntensity<=70?'var(--green)':'var(--cold)';

  $('#btnSound').textContent = state.ui.soundOn?'🔊':'🔇';
}

function renderAttentionDots(){
  const container = $('#attentionDots');
  container.innerHTML = '';
  const total = state.flags.tutorialDone ? 3 : 4;
  for(let i=0;i<total;i++){
    const dot = document.createElement('div');
    dot.className = 'attention-dot' + (i >= state.attention ? ' used' : '');
    container.appendChild(dot);
  }
}

function renderAdvisor(){
  const adv = $('#advisor');
  if(state.flags.tutorialDone){ adv.classList.add('hidden'); return; }
  const step = state.tutorialStep;
  const texts = {
    1:{text:'Это ваш регион. Каждый объект теряет энергию. Используйте мышь, чтобы вращать камеру, кликайте на здания.',btn:'Понятно'},
    2:{text:'Кликните на ТЭЦ — самое большое здание с трубами.'},
    3:{text:'Потери 55%. Причина неизвестна. Нажмите «Обследовать».'},
    4:{text:'Теперь знаете причину. Нажмите «Починить» — 30 бюджета.'},
    5:{text:'Потери снизились! Каждый сэкономленный кВт·ч превращается в бюджет.',btn:'Дальше'},
    6:{text:'Найдите Подстанцию Б и установите счётчик за 5 бюджета.'},
    7:{text:'Счётчики показывают точные цифры. Без них — только догадки.',btn:'Дальше'},
    8:{text:'Кликните на Жилмассив №1 и поговорите с жителями.'},
    9:{text:'Люди — условие успеха. Если им холодно, всё теряет смысл.',btn:'Дальше'},
    10:{text:'Завершите ход — увидите, сколько бюджета принесла работа.'},
    11:{text:'Чем ниже энергоёмкость — тем больше денег каждый ход. Петля роста.',btn:'Понятно'},
    12:{text:'Обучение завершено. Цель: энергоёмкость ≤ 70. И люди не ниже 70.',btn:'Играть'}
  };
  const info = texts[step];
  if(!info){ adv.classList.add('hidden'); return; }
  adv.classList.remove('hidden');
  adv.innerHTML = `<div class="advisor-icon">👷</div><div class="advisor-text">${info.text}</div>${info.btn?`<button class="advisor-btn">${info.btn}</button>`:''}`;
  if(info.btn) adv.querySelector('.advisor-btn').addEventListener('click', ()=>onAdvisorClick(step));
}

function onAdvisorClick(step){
  playSound('click');
  if(step===1) state.tutorialStep = 2;
  else if(step===5) state.tutorialStep = 6;
  else if(step===7) state.tutorialStep = 8;
  else if(step===9) state.tutorialStep = 10;
  else if(step===11) state.tutorialStep = 12;
  else if(step===12){ finishTutorial(); return; }
  render(); saveGame();
}

function finishTutorial(){
  state.tutorialStep = 13;
  state.flags.tutorialDone = true;
  $('#advisor').classList.add('hidden');
  render(); saveGame();
  if(state.pendingLetter){
    const letter = state.pendingLetter;
    state.pendingLetter = null;
    showLetter(letter);
  }
}

function getHighlightTarget(){
  const s = state.tutorialStep;
  if(s===2||s===3||s===4) return 'tec';
  if(s===6||s===7) return 'substation_b';
  if(s===8||s===9) return 'res1';
  return null;
}

// ============================================================
// ЛОГИКА ДЕЙСТВИЙ
// ============================================================
function isObjBuildDone(obj) {
    if (obj.id === 'promzone') return state.builds.smart_meter;
    if (obj.id === 'agro') return state.builds.biogas;
    if (obj.id === 'les') return state.builds.wood_chips || state.builds.solar;
    if (obj.id === 'dump') return state.builds.sorting;
    if (obj.insulated) return true;
    return false;
}

function canDoAction(action, obj){
  if(state.ui.isAnimating) return {ok:false, reason:'Подождите...'};
  if(!state.flags.tutorialDone){
    const step = state.tutorialStep;
    if(step===3) return (action==='study'&&obj.id==='tec')?{ok:true}:{ok:false,reason:'Следуйте подсказкам'};
    if(step===4) return (action==='repair'&&obj.id==='tec')?{ok:true}:{ok:false,reason:'Следуйте подсказкам'};
    if(step===6) return (obj.id==='substation_b' && (action==='measure'||action==='study'))?{ok:true}:{ok:false,reason:'Следуйте подсказкам'};
    if(step===8) return (action==='talk'&&obj.id==='res1')?{ok:true}:{ok:false,reason:'Следуйте подсказкам'};
    return {ok:false,reason:'Следуйте подсказкам'};
  }
  if(action==='study'){
    if(obj.studied) return {ok:false,reason:'Уже обследовано'};
    if(state.attention<1) return {ok:false,reason:'Нет внимания'};
    return {ok:true};
  }
  if(action==='measure'){
    const isTutStep6 = !state.flags.tutorialDone && state.tutorialStep===6 && obj.id==='substation_b';
    if(!obj.studied && !isTutStep6) return {ok:false,reason:'Сначала обследуйте'};
    if(obj.metered) return {ok:false,reason:'Счётчик уже стоит'};
    if(state.attention<1) return {ok:false,reason:'Нет внимания'};
    if(state.budget<5) return {ok:false,reason:'Нужно 5 бюджета'};
    return {ok:true};
  }
  if(action==='repair'){
    if(!obj.studied) return {ok:false,reason:'Сначала обследуйте'};
    if(obj.loss<=0) return {ok:false,reason:'Уже в порядке'};
    if(obj.repairCost<=0 && obj.repairEffect<=0) return {ok:false,reason:'Починка не требуется'};
    if(state.attention<1) return {ok:false,reason:'Нет внимания'};
    if(state.budget<obj.repairCost) return {ok:false,reason:`Нужно ${obj.repairCost} бюджета`};
    return {ok:true};
  }
  if(action==='build'){
    const opts = getAvailableBuilds(obj);
    if(opts.length===0) return {ok:false,reason:'Нет доступных построек'};
    if(state.attention<2) return {ok:false,reason:'Нужно 2 внимания'};
    const affordable = opts.find(o=>state.budget>=BUILDS[o].cost);
    if(!affordable) return {ok:false,reason:`Нужно от ${Math.min(...opts.map(o=>BUILDS[o].cost))} бюджета`};
    return {ok:true};
  }
  if(action==='talk'){
    if(obj.talks>=2) return {ok:false,reason:'Уже говорили'};
    if(state.attention<1) return {ok:false,reason:'Нет внимания'};
    return {ok:true};
  }
  return {ok:false,reason:'Неизвестное действие'};
}

function getAvailableBuilds(obj){
  if(!obj.studied || !obj.buildOptions) return [];
  return obj.buildOptions.filter(bId=>{
    const b = BUILDS[bId];
    if(!b) return false;
    if(bId==='build_insulation') return !obj.insulated;
    if(bId==='build_biogas') return !state.builds.biogas;
    if(bId==='build_wood_chips') return !state.builds.wood_chips;
    if(bId==='build_sorting') return !state.builds.sorting;
    if(bId==='build_smart_meter_industrial') return !state.builds.smart_meter;
    if(bId==='build_solar'){
      if(state.builds.solar) return false;
      if(state.flags.localGenerators<2) return false;
      if(state.turn<13) return false;
    }
    return true;
  });
}

async function doAction(action, obj){
  if(state.ui.isAnimating) return;
  const now = Date.now();
  if(now - state.lastActionTime < 200) return;
  state.lastActionTime = now;
  const check = canDoAction(action, obj);
  if(!check.ok){ showTooltip(check.reason); playSound('error'); return; }

  if(action === 'talk'){
    closeModal();
    setTimeout(()=>openTalkModal(obj.id), 200);
    return;
  }

  closeModal();
  state.ui.isAnimating = true;

  await cinematicAction(obj.id, ()=>{
    if(action==='study'){
      obj.studied = true;
      if(obj.factId) unlockFact(obj.factId);
      state.attention--;
      playSound('leak');
      floatText(`🔍 Изучено`, window.innerWidth/2, window.innerHeight/2, 'var(--gold)');
      if(!state.flags.tutorialDone && state.tutorialStep===3) state.tutorialStep = 4;
    }
    if(action==='measure'){
      obj.studied = true;
      obj.metered = true;
      state.flags.metersInstalled++;
      unlockFact('fact_meter');
      state.attention--;
      state.budget -= 5;
      playSound('leak');
      floatText(`📊 Счётчик установлен`, window.innerWidth/2, window.innerHeight/2, 'var(--green)');
      if(!state.flags.tutorialDone && state.tutorialStep===6) state.tutorialStep = 7;
    }
    if(action==='repair'){
      const eff = Math.min(obj.loss, obj.repairEffect);
      obj.loss = Math.max(0, obj.loss - obj.repairEffect);
      obj.repaired = (obj.repaired||0) + 1;
      state.heatForPeople = clamp(state.heatForPeople + obj.repairHeatImpact, 0, 100);
      state.budget -= obj.repairCost;
      state.attention--;
      recalcEnergyIntensity();
      if(state.objects.reduce((s,o)=>s+o.repaired,0)===1) unlockFact('fact_energy');
      floatText(`−${eff}% потерь`, window.innerWidth/2, window.innerHeight/2 - 40, 'var(--gold)');
      if(!state.flags.tutorialDone && state.tutorialStep===4) state.tutorialStep = 5;
    }
    state.log.push({turn:state.turn, action, target:obj.id});
  });

  render(); saveGame();
  state.ui.isAnimating = false;

  if(!state.flags.tutorialDone && state.tutorialStep===9){
    setTimeout(()=>{
      showDialog('Жители: «Мы готовы помогать, но объясните, что происходит».', ()=>renderAdvisor());
    }, 400);
  } else {
    setTimeout(()=>openObjectModal(obj.id), 300);
  }
}

function executeBuild(buildId, obj){
  const b = BUILDS[buildId];
  if(!b) return;
  if(state.attention < b.attention){ showTooltip('Нужно '+b.attention+' внимания'); return; }
  if(state.budget < b.cost){ showTooltip('Нужно '+b.cost+' бюджета'); return; }

  closeModal();
  cinematicAction(obj.id, ()=>{
    state.attention -= b.attention;
    state.budget -= b.cost;
    if(buildId==='build_biogas'){ obj.loss = 0; state.flags.localGenerators++; state.heatForPeople = clamp(state.heatForPeople+5,0,100); state.builds.biogas = true; unlockFact('fact_biogas'); unlockFact('fact_local'); state.pendingEffects.push({dueTurn:state.turn+1, budget:10}); }
    if(buildId==='build_wood_chips'){ state.flags.localGenerators++; state.heatForPeople = clamp(state.heatForPeople+8,0,100); state.builds.wood_chips = true; unlockFact('fact_les'); unlockFact('fact_local'); for(let i=1;i<=3;i++) state.pendingEffects.push({dueTurn:state.turn+i, budget:5}); }
    if(buildId==='build_sorting'){ state.flags.localGenerators++; state.heatForPeople = clamp(state.heatForPeople+6,0,100); state.builds.sorting = true; unlockFact('fact_dump'); unlockFact('fact_local'); }
    if(buildId==='build_insulation'){ obj.loss = Math.max(0, obj.loss-10); state.heatForPeople = clamp(state.heatForPeople+10,0,100); state.builds.insulation++; obj.insulated = true; unlockFact('fact_insulation'); }
    if(buildId==='build_smart_meter_industrial'){ obj.loss = Math.max(0, obj.loss-15); state.flags.metersInstalled += 3; state.builds.smart_meter = true; unlockFact('fact_smart_meter'); }
    if(buildId==='build_solar'){ state.flags.localGenerators++; state.heatForPeople = clamp(state.heatForPeople+3,0,100); state.builds.solar = true; unlockFact('fact_solar'); unlockFact('fact_local'); }
    recalcEnergyIntensity();
    playSound('repair');
    floatText(`🏗 ${b.name}`, window.innerWidth/2, window.innerHeight/2, 'var(--green)');
    addBuiltStructure(obj.id, buildId);
  }).then(()=>{
    render(); saveGame();
    state.ui.isAnimating = false;
    setTimeout(()=>openObjectModal(obj.id), 300);
  });
}

function addBuiltStructure(objId, buildId){
  const co = cityObjects[objId];
  if(!co) return;
  let newObj = null;
  if(buildId==='build_biogas'){
    newObj = new THREE.Mesh(new THREE.SphereGeometry(0.8, 12, 8, 0, Math.PI*2, 0, Math.PI/2), getMat('bio_dome2', 0x5aa86a));
    newObj.position.set(2.5, 0, 0);
  }
  if(buildId==='build_wood_chips'){
    newObj = new THREE.Mesh(new THREE.ConeGeometry(1, 1.2, 8), getMat('chips2', 0xc0a060));
    newObj.position.set(2, 0.6, 0);
  }
  if(buildId==='build_sorting'){
    newObj = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.2, 1.2), getMat('sorting2', 0x6a8a7a));
    newObj.position.set(2, 0.6, 0);
  }
  if(buildId==='build_smart_meter_industrial'){
    newObj = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 6), getMat('meter2', 0x5c8b9e, {metalness:0.6}));
    newObj.position.set(0, 4, 0);
  }
  if(buildId==='build_solar'){
    const solarGroup = new THREE.Group();
    for(let i=0;i<3;i++){
      const panel = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.08, 0.7), getMat('solar2', 0x2a4a6a, {metalness:0.8}));
      panel.position.set(-2 + i*1.5, 0.8, 1.5);
      panel.rotation.x = -0.3;
      panel.castShadow = true;
      solarGroup.add(panel);
    }
    co.group.add(solarGroup);
    solarGroup.scale.set(0.01, 0.01, 0.01);
    activeAnimations.push({obj: solarGroup, start: performance.now(), duration: 600, target: new THREE.Vector3(1,1,1)});
    return;
  }
  if(newObj){
    newObj.castShadow = true;
    co.group.add(newObj);
    newObj.scale.set(0.01, 0.01, 0.01);
    activeAnimations.push({obj: newObj, start: performance.now(), duration: 600, target: new THREE.Vector3(1,1,1)});
  }
  if(buildId==='build_insulation'){
    co.group.traverse(c=>{
      if(c.isMesh && c.material.color.getHex()===0xb8a888) c.material.color.setHex(0xd0c090);
    });
  }
}

// ============================================================
// МОДАЛКИ
// ============================================================
function openModal(html){
  state.ui.activeModal = state.ui.activeModal || 'generic';
  $('#modalRoot').classList.remove('hidden');
  $('#modalContent').innerHTML = html;
  const closeBtn = document.createElement('button');
  closeBtn.className = 'modal-close';
  closeBtn.innerHTML = '✕';
  closeBtn.addEventListener('click', closeModal);
  $('#modalContent').prepend(closeBtn);
}
function closeModal(){
  state.ui.activeModal = null;
  $('#modalRoot').classList.add('hidden');
  $('#modalContent').innerHTML = '';
  if(document.activeElement) document.activeElement.blur();
}

function openObjectModal(id){
  const obj = state.objects.find(o=>o.id===id);
  if(!obj) return;
  state.ui.activeModal = 'object';
  state.ui.selectedObjectId = id;

  const tutActive = !state.flags.tutorialDone;
  const step = state.tutorialStep;
  let advisorText = '';
  if(tutActive){
    if(step===3) advisorText = '<b>Советник:</b> Потери 55%. Причина неизвестна. Нажмите «Обследовать».';
    if(step===4) advisorText = '<b>Советник:</b> Теперь знаете причину. Нажмите «Починить» — 30 бюджета.';
    if(step===6 && obj.id==='substation_b') advisorText = '<b>Советник:</b> Установите счётчик за 5 бюджета.';
    if(step===8 && obj.id==='res1') advisorText = '<b>Советник:</b> Поговорите с жителями — это бесплатно.';
  }

  const lossCls = obj.loss<=0?'zero':obj.loss<=15?'low':'';
  const lossKnown = obj.studied;

  let html = `<div class="modal-title"><span>${obj.icon}</span> ${obj.name}</div>`;
  html += `<div class="modal-body">`;
  if(lossKnown){
    html += `<div class="modal-loss ${lossCls}">Потери: ${obj.metered?obj.loss+'%':'~'+Math.round(obj.loss/5)*5+'%'}</div>`;
    if(obj.causeText) html += `<div class="modal-cause ${obj.loss<=0?'ok':''}">${obj.loss<=0?'✅ В порядке':obj.causeText}</div>`;
  } else {
    html += `<div class="modal-loss">Потери: ? %</div>`;
    html += `<div class="modal-cause">Причина неизвестна. Проведите обследование.</div>`;
  }
  if(obj.metered) html += `<div style="color:var(--green);font-size:12px;margin-top:6px">📊 Счётчик установлен — точный учёт</div>`;
  html += `</div>`;

  const actions = [];
  const buildAvail = getAvailableBuilds(obj);
  const isTutStep6 = !state.flags.tutorialDone && state.tutorialStep===6 && obj.id==='substation_b';

  if(!obj.studied && !isTutStep6) actions.push({id:'study', label:'👁 Обследовать', cost:'1 внимание', primary:true});
  if((obj.studied || isTutStep6) && !obj.metered) actions.push({id:'measure', label:'📊 Замерить', cost:'1 внимание + 5 💰', primary: isTutStep6});
  if(obj.studied && obj.loss>0 && (obj.repairCost>0 || obj.repairEffect>0)) actions.push({id:'repair', label:'🔧 Починить', cost:`1 внимание + ${obj.repairCost} 💰`});
  if(buildAvail.length>0){
    const minCost = Math.min(...buildAvail.map(b=>BUILDS[b].cost));
    actions.push({id:'build', label:'🏗 Построить', cost:`2 внимания + от ${minCost} 💰`});
  }
  if((obj.talks||0)<2) actions.push({id:'talk', label:'💬 Переговорить', cost:'1 внимание · +доверие'});

  if(actions.length>0){
    html += `<div class="modal-actions">`;
    actions.forEach(a=>{
      const check = canDoAction(a.id, obj);
      const disabled = !check.ok;
      const primaryCls = a.primary && !disabled ? ' primary' : '';
      html += `<button class="btn-modal${primaryCls}" data-action="${a.id}" ${disabled?'disabled':''} title="${disabled?check.reason:''}">
        <span>${a.label}</span>
        <span class="btn-modal-cost">${a.cost}</span>
      </button>`;
    });
    html += `</div>`;
  }

  html += `<div style="margin-top:14px;font-size:11px;color:var(--text-dim);text-align:center">Внимание: ${state.attention} / ${state.flags.tutorialDone?3:4}</div>`;
  if(advisorText) html += `<div class="modal-advisor">${advisorText}</div>`;

  openModal(html);
  $('#modalContent').querySelectorAll('.btn-modal').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const action = btn.dataset.action;
      if(action==='build'){ openBuildModal(obj.id); return; }
      doAction(action, obj);
    });
  });
}

// ============================================================
// ДИАЛОГ
// ============================================================
function openTalkModal(id){
  const obj = state.objects.find(o=>o.id===id);
  if(!obj) return;
  const check = canDoAction('talk', obj);
  if(!check.ok){ showTooltip(check.reason); playSound('error'); return; }

  let dialog = DIALOGS[id] || {portrait:'🧑', name:'Житель', text:'Здравствуйте.', replies:[{text:'Понятно',heat:3}]};
  
  // Если постройка уже выполнена, меняем текст на благодарность
  if (isObjBuildDone(obj)) {
      dialog = { 
          portrait: dialog.portrait, 
          name: dialog.name, 
          text: '«Спасибо вам огромное! После ваших улучшений стало намного лучше. Мы это очень ценим.»', 
          replies: [{text: 'Работаем дальше!', heat: 5}] 
      };
  }

  state.ui.activeModal = 'talk';

  let html = `<div class="talk-portrait">${dialog.portrait}</div>`;
  html += `<div class="talk-name">${dialog.name}</div>`;
  html += `<div class="talk-text">${dialog.text}</div>`;
  html += `<div class="talk-replies">`;
  dialog.replies.forEach((r, i)=>{
    const effects = [];
    if(r.heat) effects.push(`+${r.heat} 🧡`);
    html += `<button class="talk-reply" data-idx="${i}">
      <span>${r.text}</span>
      <span class="talk-reply-effect">${effects.join(' · ')}</span>
    </button>`;
  });
  html += `</div>`;
  openModal(html);

  $('#modalContent').querySelectorAll('.talk-reply').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const idx = parseInt(btn.dataset.idx);
      const reply = dialog.replies[idx];
      applyTalkResult(obj, reply);
    });
  });
}

function applyTalkResult(obj, reply){
  obj.talks = (obj.talks||0)+1;
  state.attention--;
  state.heatForPeople = clamp(state.heatForPeople + (reply.heat||0), 0, 100);
  if(reply.budget) state.budget += reply.budget;
  if(state.log.filter(l=>l.action==='talk').length === 0) unlockFact('fact_saving');
  playSound('click');
  floatText(`+${reply.heat} 🧡`, window.innerWidth/2, window.innerHeight/2, 'var(--green)');
  state.log.push({turn:state.turn, action:'talk', target:obj.id});

  closeModal();
  render(); saveGame();

  if(!state.flags.tutorialDone && state.tutorialStep===8){
    state.tutorialStep = 9;
    setTimeout(()=>{
      showDialog('Жители: «Мы готовы помогать, но объясните, что происходит».', ()=>{
        renderAdvisor();
      });
    }, 300);
    return;
  }
  setTimeout(()=>openObjectModal(obj.id), 200);
}

function openBuildModal(id){
  const obj = state.objects.find(o=>o.id===id);
  if(!obj) return;
  const opts = getAvailableBuilds(obj);
  if(opts.length===0){ showTooltip('Нет доступных построек'); return; }
  if(opts.length===1){
    const bId = opts[0];
    const b = BUILDS[bId];
    if(state.budget<b.cost){ showTooltip('Нужно '+b.cost+' бюджета'); playSound('error'); return; }
    if(state.attention<b.attention){ showTooltip('Нужно '+b.attention+' внимания'); playSound('error'); return; }
    executeBuild(bId, obj);
    return;
  }
  state.ui.activeModal = 'build';
  let html = `<div class="modal-title">🏗 Построить</div><div class="modal-body">`;
  opts.forEach(bId=>{
    const b = BUILDS[bId];
    const disabled = state.budget<b.cost || state.attention<b.attention;
    html += `<div style="background:var(--panel-light);padding:12px;border-radius:8px;margin-bottom:10px;opacity:${disabled?.5:1}">
      <div style="font-weight:700;color:var(--amber);margin-bottom:6px">${b.icon} ${b.name}</div>
      <div style="font-size:13px;margin-bottom:8px">${b.desc}</div>
      <button class="btn-modal primary" data-build="${bId}" ${disabled?'disabled':''} style="width:100%">
        <span>Построить</span>
        <span class="btn-modal-cost">${b.attention} внимания · ${b.cost} 💰</span>
      </button>
    </div>`;
  });
  html += `</div>`;
  openModal(html);
  $('#modalContent').querySelectorAll('[data-build]').forEach(btn=>{
    btn.addEventListener('click', ()=>executeBuild(btn.dataset.build, obj));
  });
}

function showDialog(text, onClose){
  state.ui.activeModal = 'dialog';
  let html = `<div class="modal-title">💬 Диалог</div>`;
  html += `<div class="modal-body" style="font-size:15px;line-height:1.6;font-style:italic">${text}</div>`;
  html += `<button class="btn-modal primary" id="dialogOk" style="width:100%">Продолжить</button>`;
  openModal(html);
  $('#dialogOk').addEventListener('click', ()=>{ closeModal(); if(onClose) onClose(); });
}

// ============================================================
// СОБЫТИЯ (КРИЗИСЫ)
// ============================================================
function showEvent(event) {
    state.ui.activeModal = 'event';
    let html = `<div class="modal-title">${event.title}</div>`;
    html += `<div class="modal-body" style="font-size:14px; line-height:1.6;">${event.text}</div>`;
    html += `<div class="modal-actions" style="grid-template-columns: 1fr;">`;
    event.options.forEach((opt, i) => {
        html += `<button class="btn-modal primary event-option" data-idx="${i}">
            <span style="font-weight:700;">${opt.text}</span>
        </button>`;
    });
    html += `</div>`;
    openModal(html);

    $('#modalContent').querySelectorAll('.event-option').forEach(btn => {
        btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.idx);
            const opt = event.options[idx];
            opt.effect(state);
            recalcEnergyIntensity(); // пересчитываем после изменения
            closeModal();
            saveGame();
            render();
            // Показываем письмо, если оно есть, или просто продолжаем
            if(state.pendingLetter) {
                const l = state.pendingLetter;
                state.pendingLetter = null;
                setTimeout(() => showLetter(l), 300);
            }
        });
    });
}

// СПРАВОЧНИК И ПОМОЩЬ
// ============================================================
function openEncyclopedia(){
  state.ui.activeModal = 'encyclopedia';
  const allFacts = Object.keys(ENCYCLOPEDIA);
  const unlocked = state.unlockedFacts;

  html += `<div class="modal-body" style="font-size:13px;color:var(--text-dim)">Открыто ${unlocked.length} из ${allFacts.length} карточек.</div>`;
  html += `<div class="encyclopedia">`;

      html += `<div class="ency-card"><div class="ency-card-title">${f.title}</div><div class="ency-card-text">${f.text}</div><div class="ency-card-source">${f.source}</div></div>`;

      html += `<div class="ency-card locked"><div class="ency-card-title">?</div><div class="ency-card-text">Откроется по мере игры</div></div>`;

}

function showLetter(letter){
  state.ui.activeModal = 'letter';
  if(letter.effect) letter.effect(state);
  playSound('letter');
  let html = `<div class="letter-portrait">${letter.portrait}</div>`;
  html += `<div class="modal-body" style="font-size:15px;line-height:1.6;font-style:italic;text-align:center">${letter.text}</div>`;

  html += `<button class="btn-modal primary" id="letterOk" style="width:100%;margin-top:16px">Понятно</button>`;

// ============================================================
// ХОД
// ============================================================
function endTurn(){
  if(state.ui.isAnimating) return;
  if(!state.flags.tutorialDone && state.tutorialStep!==10) return;
  state.ui.isAnimating = true;
  if(checkGameOver()){ state.ui.isAnimating = false; return; }

  const income = Math.floor(15 + (100 - state.energyIntensity) / 4);
  state.budget += income;

  const due = (state.pendingEffects||[]).filter(p=>p.dueTurn===state.turn);
  due.forEach(p=>{ state.budget += p.budget; });
  state.pendingEffects = (state.pendingEffects||[]).filter(p=>p.dueTurn!==state.turn);

  state.turn += 1;
  state.year = Math.ceil(state.turn / 4);
  state.season = SEASON_ORDER[(state.turn - 1) % 4];
  state.attention = state.flags.tutorialDone ? 3 : 4;
  state.ui.selectedObjectId = null;

  if(state.turn % 4 === 0 && state.turn <= 20){
    const drop = state.flags.localGenerators >= 2 ? 2 : 5;
    state.heatForPeople = clamp(state.heatForPeople - drop, 0, 100);
    unlockFact('fact_winter');
  }

  if(checkGameOver()){ state.ui.isAnimating = false; return; }
  if(state.turn > 20){ state.ui.isAnimating = false; saveGame(); render(); checkEnding(); return; }

  // События
  if (state.turn % 4 === 2 && state.turn <= 18) {
      const ev = EVENTS[Math.floor(Math.random() * EVENTS.length)];
      state.pendingEvent = ev;
  }

  const letter = LETTERS[state.turn];
  if(letter) state.pendingLetter = letter;

  const wasStep10 = !state.flags.tutorialDone && state.tutorialStep===10;
  if(wasStep10){
    state.tutorialStep = 11;
    saveGame(); render();
    state.ui.isAnimating = false;
    showTurnBanner(income, ()=>{});
    return;
  }
  
  saveGame(); render();
  showTurnBanner(income, ()=>{
    if (state.pendingEvent && state.flags.tutorialDone) {
        const ev = state.pendingEvent;
        state.pendingEvent = null;
        showEvent(ev);
        state.ui.isAnimating = false;
    } else if(state.pendingLetter && state.flags.tutorialDone){
      const l = state.pendingLetter;
      state.pendingLetter = null;
      showLetter(l);
      state.ui.isAnimating = false;
    } else {
      state.ui.isAnimating = false;
      render();
    }
  });
}

function showTurnBanner(income, onDone){
  playSound('turn');
  const banner = document.createElement('div');
  banner.className = 'turn-banner';
  banner.textContent = `Год ${state.year}, ${SEASON_NAMES[SEASON_ORDER.indexOf(state.season)]} · +${income} 💰`;
  document.body.appendChild(banner);
  setTimeout(()=>{
    banner.style.transition = 'opacity .4s';
    banner.style.opacity = '0';
    setTimeout(()=>{ banner.remove(); if(onDone) onDone(); }, 400);
  }, 1500);
}

function checkGameOver(){
  if(state.heatForPeople < 25){ showEnding('fail_heat'); return true; }
  if(state.energyIntensity >= 95 && state.heatForPeople < 40){ showEnding('fail_catastrophe'); return true; }
  if(state.budget < -100){ showEnding('fail_budget'); return true; }
  return false;
}

function checkEnding(){
  let ending;
  if(state.flags.creditsTaken===0 && state.flags.localGenerators>=2 && state.flags.metersInstalled>=2 && state.energyIntensity<=70 && state.heatForPeople>=70){
    ending = 'resonance';
  } else if(state.energyIntensity<=70 && state.heatForPeople<60){
    ending = 'showcase';
  } else if(state.heatForPeople>=60 && state.energyIntensity>85){
    ending = 'warmth';
  } else { ending = 'compromise'; }
  showEnding(ending);
}
function showEnding(key){
  const e = ENDINGS[key];
  if(!e) return;
  unlockFact('fact_what_next');
  playSound(key==='resonance'?'good':'bad');
  const screen = document.createElement('div');
  screen.className = 'ending-screen '+e.cls;
  screen.innerHTML = `
    <div class="ending-content">
      <div class="ending-title">${e.name}</div>
      <div class="ending-text">${e.text}</div>
      <div class="ending-buttons">
        <button class="btn-start" id="btnPlayAgain">Играть снова</button>
        <button class="btn-reset" id="btnDownloadCard">Скачать карточку</button>
      </div>
    </div>`;
  document.body.appendChild(screen);
  $('#btnPlayAgain').addEventListener('click', ()=>{ resetGame(); location.reload(); });
  $('#btnDownloadCard').addEventListener('click', ()=>downloadCard(key));
  setTimeout(()=>showDiary(e), 2000);
}
function showDiary(e){
  const screen = document.createElement('div');
  screen.className = 'diary-screen';
  const lines = e.diary.split('\n');
  let html = '<div class="diary-content"><div class="diary-text">';
  lines.forEach((l,i)=>{ html += `<div class="diary-line" style="animation-delay:${i*1.2}s">${l}</div>`; });
  html += '</div></div>';
  html += `<div class="titr">В среднем семья экономит 25% электроэнергии. Источник: IEA, 2023.</div>`;
  screen.innerHTML = html;
  document.body.appendChild(screen);
}
function downloadCard(endingKey){
  const e = ENDINGS[endingKey];
  const w = 900, h = 700;
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  renderer.render(scene, camera);
  const screenshot = renderer.domElement.toDataURL('image/png');
  const img = new Image();
  img.onload = ()=>{
    ctx.drawImage(img, 0, 0, w, h);
    ctx.fillStyle = 'rgba(26,35,50,0.72)';
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = '#b87333'; ctx.lineWidth = 3;
    ctx.strokeRect(20, 20, w-40, h-40);
    ctx.fillStyle = '#e8a33d';
    ctx.font = 'bold 48px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('БАЛАНС', w/2, 100);
    ctx.fillStyle = '#e8dcc4';
    ctx.font = '30px Georgia, serif';
    ctx.fillText(e.name, w/2, 160);
    ctx.font = '18px system-ui, sans-serif';
    ctx.textAlign = 'left';
    const stats = [
      ['Энергоёмкость:', Math.round(state.energyIntensity)+' / 70'],
      ['Тепло для людей:', Math.round(state.heatForPeople)+' / 100'],
      ['Бюджет:', Math.round(state.budget)],
      ['Ходов пройдено:', Math.min(state.turn-1,20)+' / 20'],
      ['Локальных генераторов:', state.flags.localGenerators],
      ['Установлено счётчиков:', state.flags.metersInstalled]
    ];
    stats.forEach((s,i)=>{
      ctx.fillStyle = '#9aa5b1'; ctx.fillText(s[0], 80, 260+i*36);
      ctx.fillStyle = '#ffd966'; ctx.fillText(s[1], 480, 260+i*36);
    });
    ctx.fillStyle = '#e8a33d';
    ctx.font = 'italic 16px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('3D-симулятор энергосистемы региона', w/2, h-60);
    canvas.toBlob(blob=>{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `balans3d-${endingKey}.png`;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
    });
  };
  img.src = screenshot;
}

// ============================================================
// АНИМАЦИЯ
// ============================================================
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  // Камера
  if(cam.mode === 'overview'){
    cam.overviewAngle += dt * 0.08;
    const r = 26;
    cam.targetPos.x = Math.cos(cam.overviewAngle) * r;
    cam.targetPos.z = Math.sin(cam.overviewAngle) * r;
    cam.targetPos.y = 20;
    cam.targetLook.set(0, 1, 0);
  }
  const lerpSpeed = Math.min(3 * dt, 1);
  cam.currentPos.lerp(cam.targetPos, lerpSpeed);
  cam.currentLook.lerp(cam.targetLook, lerpSpeed);
  camera.position.copy(cam.currentPos);
  camera.lookAt(cam.currentLook);

  // Кольцо
  if(selectionRing.mesh.visible){
    const s = 1 + Math.sin(performance.now() * 0.005) * 0.1;
    selectionRing.mesh.scale.set(s, s, 1);
    selectionRing.mesh.rotation.z += dt * 0.5;
  }

  // Дым
  state.objects.forEach(obj=>{
    const co = cityObjects[obj.id];
    if(co && co.smoke) co.smoke.update(dt);
  });

  // Люди
  people.forEach(p=>p.update(dt));
  // Машины
  cars.forEach(c=>c.update(dt));

  // Анимации масштаба
  for(let i=activeAnimations.length-1; i>=0; i--){
    const a = activeAnimations[i];
    const elapsed = (performance.now() - a.start) / a.duration;
    if(elapsed >= 1){
      a.obj.scale.copy(a.target);
      activeAnimations.splice(i, 1);
    } else {
      const ease = 1 - Math.pow(1 - elapsed, 3);
      a.obj.scale.set(a.target.x * ease, a.target.y * ease, a.target.z * ease);
    }
  }

  renderer.render(scene, camera);
}

// ============================================================
// ИНИЦИАЛИЗАЦИЯ
// ============================================================
function init(){
  initThree();
  animate();

  setTimeout(()=>{
    $('#loader').classList.add('hidden');
    const loaded = loadSave();
    if(loaded && loaded.turn>0){
      state = loaded;
      $('#btnStart').textContent = 'Продолжить';
      $('#btnReset').classList.remove('hidden');
      $('#btnStart').addEventListener('click', ()=>startGame(false));
      $('#btnReset').addEventListener('click', ()=>{
        if(confirm('Сбросить прогресс?')){ resetGame(); $('#btnStart').textContent='Начать'; $('#btnReset').classList.add('hidden'); }
      });
    } else {
      state = createDefaultState();
      $('#btnStart').addEventListener('click', ()=>startGame(true));
    }
    $('#startScreen').classList.remove('hidden');
  }, 800);

  $('#btnHelp').addEventListener('click', ()=>{ playSound('click'); openHelp(); });
  $('#btnEncyclopedia').addEventListener('click', ()=>{ playSound('click'); openEncyclopedia(); });
  $('#btnSound').addEventListener('click', ()=>{ state.ui.soundOn = !state.ui.soundOn; saveGame(); $('#btnSound').textContent = state.ui.soundOn?'🔊':'🔇'; });
  $('#btnResetGame').addEventListener('click', ()=>{ if(confirm('Сбросить игру?')){ resetGame(); location.reload(); } });
  $('#btnEndTurn').addEventListener('click', ()=>{ playSound('click'); endTurn(); });
  $('#btnOverview').addEventListener('click', ()=>{ playSound('click'); returnToOverview(); });

  $('#budgetStat').addEventListener('mouseenter', ()=>showInfoTooltip('Бюджет тратится на ремонт и постройки. Каждый ход пополняется от эффективности.', $('#budgetStat')));
  $('#heatStat').addEventListener('mouseenter', ()=>showInfoTooltip('Доверие людей. Ниже 25 — социальный взрыв и проигрыш. Нужно 70+ для лучшей концовки.', $('#heatStat')));
  $('#energyStat').addEventListener('mouseenter', ()=>showInfoTooltip('Энергоёмкость. Цель — снизить до 70. Каждая единица потерь влияет на бюджет.', $('#energyStat')));

  document.addEventListener('keydown', e=>{
    if(e.key === 'Escape'){
      if(state.ui.activeModal) closeModal();
      else if(cam.mode !== 'overview') returnToOverview();
    }
  });
}

function startGame(isNew){
  if(isNew){
    state = createDefaultState();
    state.tutorialStep = 1;
    state.attention = 4;
    saveGame();
  }
  $('#startScreen').classList.add('hidden');
  $('#gameUI').classList.remove('hidden');
  if(state.tutorialStep===0 && !state.flags.tutorialDone){
    state.tutorialStep = 1;
    state.attention = 4;
  }
  render();
  saveGame();
  if(isNew && !state.flags.helpSeen){
    state.flags.helpSeen = true;
    saveGame();
    setTimeout(()=>openHelp(), 500);
  }
}

document.addEventListener('DOMContentLoaded', init);
</script>
